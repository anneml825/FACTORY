name: Phase E Cloudflare preflight

# Verifies the owner's least-privilege token and provisions ONLY the D1 database.
#
# Deliberately does not deploy a Worker, upload an artifact, touch Stripe, or
# create any commercial object. Its whole job is to answer three questions with
# real Cloudflare behaviour instead of documentation:
#
#   1. Does the token authenticate, and what is it actually scoped to?
#   2. Can a brand-new Free account create a D1 database with no card on file?
#   3. What does Cloudflare report back — identifiers, limits, errors?
#
# Secrets are GitHub-masked. The token value is never echoed; only the API's own
# structured verdict about it is printed.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/factory-phase-e-remediation
    paths:
      - '.github/workflows/phase-e-cloudflare-preflight.yml'
      - 'tools/verify/cloudflare-preflight.py'

permissions:
  contents: read

concurrency:
  group: phase-e-cloudflare-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_NAME: factory-edge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Diagnose credential visibility
        env:
          # Presence probes only. Values are never printed — each is reduced to a
          # boolean before it reaches the log. `vars` is checked too because the
          # GitHub UI puts Secrets and Variables on the same page under separate
          # tabs, and a value entered on the Variables tab is invisible to
          # `secrets.*`.
          SECRET_TOKEN_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          SECRET_ACCOUNT_SET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          VAR_TOKEN_SET: ${{ vars.CLOUDFLARE_API_TOKEN != '' }}
          VAR_ACCOUNT_SET: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
          VAR_NAMES: ${{ toJSON(vars) }}
        run: |
          echo "Actions SECRET  CLOUDFLARE_API_TOKEN  present: $SECRET_TOKEN_SET"
          echo "Actions SECRET  CLOUDFLARE_ACCOUNT_ID present: $SECRET_ACCOUNT_SET"
          echo "Actions VARIABLE CLOUDFLARE_API_TOKEN  present: $VAR_TOKEN_SET"
          echo "Actions VARIABLE CLOUDFLARE_ACCOUNT_ID present: $VAR_ACCOUNT_SET"
          # Variable NAMES only. Variables are not secret, but their values are
          # still withheld here on principle.
          echo "$VAR_NAMES" | python3 -c 'import json,sys; print("variable names defined:", sorted(json.load(sys.stdin).keys()))'

      - name: Fail closed if credentials are absent
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Both values must exist as Actions repository SECRETS on anneml825/FACTORY."
            exit 1
          fi
          echo "Both credentials are present (values never printed)."

      - name: Query token and account scope
        run: |
          curl -sS -X GET "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -o verify.json
          curl -sS -X GET "https://api.cloudflare.com/client/v4/accounts" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -o accounts.json
          python3 tools/verify/cloudflare-preflight.py

      - name: Provision the D1 database
        run: |
          echo "--- create (a harmless failure here means it already exists) ---"
          npx --yes wrangler@latest d1 create "$D1_NAME" 2>&1 | sed 's/^/  /' || true
          echo "--- authoritative listing ---"
          npx --yes wrangler@latest d1 list --json > d1.json
          python3 tools/verify/cloudflare-preflight.py --databases

      - name: Ask Cloudflare what it created
        run: |
          npx --yes wrangler@latest d1 info "$D1_NAME" 2>&1 | sed 's/^/  /' || echo "d1 info unavailable"

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-preflight
          path: |
            verify.json
            accounts.json
            d1.json
          retention-days: 7
          if-no-files-found: warn
