name: Commercial edge deploy

# Deploys the COMMERCIAL edge: a different Worker and a different database from
# the fixture edge, holding durable WATCH, transaction, attribution and
# fulfillment history.
#
# What this workflow will never do, by construction:
#   * reset, drop, or truncate anything — no destructive step exists here;
#   * regenerate a signing secret — secrets are installed once and kept;
#   * create, deactivate, or sweep any Stripe object;
#   * enable commercial serving on its own authority.
#
# Serving requires three independent things to be true at once: this workflow
# deployed with serving=enabled, the database is stamped COMMERCIAL, and an
# owner authorization row exists. Any one of them false means the edge serves
# nothing commercially. Stopping needs only one of them to change.
on:
  workflow_dispatch:
    inputs:
      serving:
        description: 'Commercial serving for this deploy'
        type: choice
        options: [disabled, enabled]
        default: disabled
  # A push to the workflow itself redeploys with serving OFF. Serving can only
  # ever be turned on by an explicit dispatch, so an automatic run cannot start
  # selling anything.
  push:
    branches:
      - claude/factory-phase-e-remediation
    paths:
      - '.github/workflows/phase-e-commercial-deploy.yml'

permissions:
  contents: read

concurrency:
  group: commercial-edge-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFARE_ACCOUNT_ID }}
      EDGE_TARGET: commercial
      WORKER_NAME: factory-commerce
      WRANGLER_ENV: commercial
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Fail closed on missing credentials
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not available to this workflow."
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci || npm install

      # The isolation tests are the reason to believe the rest of this workflow
      # is safe, so they run before it does anything.
      - name: Prove fixture and commercial state are isolated
        run: node --test src/edge/commercial-isolation.test.ts

      # Idempotent: creating a database that already exists is reported and
      # ignored. D1 databases are free and capped at ten per account.
      - name: Create the commercial database if it does not exist
        run: |
          set +e
          out=$(npx --yes wrangler@latest d1 create factory-commerce 2>&1)
          set -e
          echo "$out"
          echo "$out" | grep -Eo 'database_id = "[0-9a-f-]+"' || true
          echo "::notice::If a database_id is printed above, commit it into wrangler.toml before deploying."

      # Refuses to go further while wrangler would resolve the fixture database,
      # the placeholder id, or anything other than the commercial binding.
      # Two checks, because they catch different mistakes. The dry-run proves
      # wrangler resolves this environment to the commercial binding; reading the
      # configuration proves the id behind that binding is real and is not the
      # fixture's. The dry-run alone is not enough — it prints binding names but
      # not ids, so the first run of this workflow passed it while pointing at an
      # unprovisioned placeholder.
      - name: Assert the resolved configuration is the commercial one
        run: |
          npx --yes wrangler@latest deploy --env "$WRANGLER_ENV" --dry-run --outdir /tmp/commercial-build 2>&1 | tee resolve.log
          grep -q "env.EDGE_DB (factory-commerce)" resolve.log \
            || { echo "::error::The commercial environment did not resolve to the commercial database."; exit 1; }

          block=$(sed -n '/^\[env\.commercial\]/,$p' wrangler.toml)
          echo "$block" | grep -q 'database_name = "factory-commerce"' \
            || { echo "::error::The commercial block does not name the commercial database."; exit 1; }
          if echo "$block" | grep -q 'COMMERCIAL_DATABASE_NOT_YET_PROVISIONED'; then
            echo "::error::The commercial database has not been provisioned. Bootstrap it and commit the id."
            exit 1
          fi
          if echo "$block" | grep -q '3fa6df57-8c13-4bd1-af87-756a089049b0'; then
            echo "::error::The commercial environment is bound to the FIXTURE database id."
            exit 1
          fi

      # Deployed with serving off first, always. The Worker has to exist before a
      # secret can be attached to it, so this intermediate state is unavoidable —
      # but it is not ambiguous: with no authorization row and no serving
      # variable, commercial serving is definitively closed.
      - name: Deploy with commercial serving off
        run: |
          npx --yes wrangler@latest deploy --env "$WRANGLER_ENV" \
            --var COMMERCIAL_SERVING:disabled \
            --var MAX_DOWNLOADS_PER_GRANT:3 \
            2>&1 | tee deploy-closed.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy-closed.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::Could not determine the commercial Worker URL."
            exit 1
          fi
          echo "COMMERCIAL_BASE_URL=$url" >> "$GITHUB_ENV"

      - name: Install any missing secrets, replacing none
        run: node src/edge/deploy/ensure-edge-secrets.ts
        env:
          ALLOW_MISSING_SECRETS: 'yes'

      - name: Apply the schema and stamp the deployment identity
        run: node src/edge/deploy/migrate-edge-db.ts

      # Every commercial deploy leaves its own proof that a redeploy preserves
      # durable state: a canary is written, the Worker is redeployed, and the
      # canary is read back. One row per deploy, filed under a reserved
      # experiment key so it can never be mistaken for commercial history.
      - name: Record durable state before redeploy
        run: |
          # A single clearly-labelled canary row. It is the only synthetic entry
          # this database will ever hold, it is filed under a reserved
          # experiment key, and it exists so the claim "redeploy preserves
          # durable state" is a measurement rather than an assurance.
          stamp="deploy-proof-${GITHUB_RUN_ID}"
          npx --yes wrangler@latest d1 execute factory-commerce --remote --yes --command \
            "INSERT INTO watch_event_inbox (event_id, experiment_key, asset_key, event_type, environment, payload, signature, payload_sha256) VALUES ('$stamp', 'deployment-proof', 'deployment-proof', 'DEPLOYMENT_PROOF', 'PROVIDER_TEST', '{}', 'n/a', 'n/a')"
          echo "CANARY_EVENT_ID=$stamp" >> "$GITHUB_ENV"
          npx --yes wrangler@latest d1 execute factory-commerce --remote --yes --json \
            --command "SELECT count(*) AS events FROM watch_event_inbox" | tee before.json

      - name: Redeploy
        run: |
          npx --yes wrangler@latest deploy --env "$WRANGLER_ENV" \
            --var COMMERCIAL_SERVING:disabled \
            --var MAX_DOWNLOADS_PER_GRANT:3
          node src/edge/deploy/migrate-edge-db.ts

      - name: Prove durable state survived the redeploy
        run: |
          after=$(npx --yes wrangler@latest d1 execute factory-commerce --remote --yes --json \
            --command "SELECT event_id FROM watch_event_inbox WHERE event_id = '$CANARY_EVENT_ID'")
          echo "$after"
          echo "$after" | grep -q "$CANARY_EVENT_ID" \
            || { echo "::error::A redeploy lost durable journal state."; exit 1; }
          echo "The canary written before the redeploy is still present afterwards."

      - name: Prove the commercial journal is append-only
        run: |
          set +e
          out=$(npx --yes wrangler@latest d1 execute factory-commerce --remote --yes \
            --command "UPDATE watch_event_inbox SET event_type='TAMPERED'" 2>&1)
          set -e
          echo "$out" | tail -3
          echo "$out" | grep -q "append-only" \
            || { echo "::error::The commercial journal accepted a mutation."; exit 1; }

      # Only now, and only if the database itself already carries an owner
      # authorization, may serving be turned on.
      - name: Enable commercial serving
        if: ${{ inputs.serving == 'enabled' }}
        run: |
          count=$(npx --yes wrangler@latest d1 execute factory-commerce --remote --yes --json \
            --command "SELECT count(*) AS n FROM commercial_launch_authorization" | grep -oE '"n": *[0-9]+' | grep -oE '[0-9]+')
          echo "authorizations: $count"
          if [ "${count:-0}" -lt 1 ]; then
            echo "::error::Refusing to enable serving: the database holds no owner launch authorization."
            exit 1
          fi
          npx --yes wrangler@latest deploy --env "$WRANGLER_ENV" \
            --var COMMERCIAL_SERVING:enabled \
            --var MAX_DOWNLOADS_PER_GRANT:3

      - name: Report the deployed posture
        run: |
          posture=$(curl -fsS "$COMMERCIAL_BASE_URL/posture")
          echo "$posture"
          echo "$posture" | grep -q '"deploymentPurpose": "COMMERCIAL"' \
            || { echo "::error::The commercial edge does not identify itself as COMMERCIAL."; exit 1; }
          if [ "${{ inputs.serving }}" != "enabled" ]; then
            echo "$posture" | grep -q '"commercialServing": false' \
              || { echo "::error::Serving is on when it was deployed off."; exit 1; }
          fi
          {
            echo "### Commercial edge"
            echo ""
            echo "URL: $COMMERCIAL_BASE_URL"
            echo ""
            echo '```json'
            echo "$posture"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
