name: Commercial edge deploy

# Deploys the COMMERCIAL edge: a different Worker and a different database from
# the fixture edge, holding durable WATCH, transaction, attribution and
# fulfillment history.
#
# What this workflow will never do, by construction:
#   * reset, drop, or truncate commercial history. One fenced migration removes
#     only the known unsigned legacy canaries after proving there is no commerce;
#   * regenerate a signing secret — secrets are installed once and kept;
#   * create, deactivate, or sweep any Stripe object;
#   * enable commercial serving on its own authority.
#
# Manual only: this workflow changes a deployed provider resource. Serving
# requires an enabled deployment, a COMMERCIAL database identity, a complete
# configuration, and an unexpired/unrevoked owner grant matching the exact
# scope digest. Any one false stops serving.
on:
  workflow_dispatch:
    inputs:
      serving:
        description: 'Commercial serving for this deploy'
        type: choice
        options: [disabled, enabled]
        default: disabled
      scope_digest:
        description: 'Authorized 64-character SHA-256 scope (required only when enabling)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: commercial-edge-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFARE_ACCOUNT_ID }}
      EDGE_TARGET: commercial
      WORKER_NAME: factory-commerce
      WRANGLER_ENV: commercial
      EDGE_BUILD_BASE: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Fail closed on missing credentials
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not available to this workflow."
              exit 1
            fi
          done
          if [ "${{ inputs.serving }}" = "enabled" ] && ! printf '%s' "${{ inputs.scope_digest }}" | grep -Eq '^[a-f0-9]{64}$'; then
            echo "::error::Enabling requires the exact authorized 64-character SHA-256 scope digest."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci || npm install

      # The isolation tests are the reason to believe the rest of this workflow
      # is safe, so they run before it does anything.
      - name: Prove fixture and commercial state are isolated
        run: node --test src/edge/commercial-isolation.test.ts

      # Idempotent: creating a database that already exists is reported and
      # ignored. D1 databases are free and capped at ten per account.
      - name: Create the commercial database if it does not exist
        run: |
          set +e
          out=$(npx --yes wrangler@latest d1 create factory-commerce 2>&1)
          set -e
          echo "$out"
          echo "$out" | grep -Eo 'database_id = "[0-9a-f-]+"' || true
          echo "::notice::If a database_id is printed above, commit it into wrangler.toml before deploying."

      # Refuses to go further while wrangler would resolve the fixture database,
      # the placeholder id, or anything other than the commercial binding.
      # Two checks, because they catch different mistakes. The dry-run proves
      # wrangler resolves this environment to the commercial binding; reading the
      # configuration proves the id behind that binding is real and is not the
      # fixture's. The dry-run alone is not enough — it prints binding names but
      # not ids, so the first run of this workflow passed it while pointing at an
      # unprovisioned placeholder.
      - name: Assert the resolved configuration is the commercial one
        run: |
          npx --yes wrangler@latest deploy --env "$WRANGLER_ENV" --dry-run --outdir /tmp/commercial-build 2>&1 | tee resolve.log
          grep -q "env.EDGE_DB (factory-commerce)" resolve.log \
            || { echo "::error::The commercial environment did not resolve to the commercial database."; exit 1; }

          block=$(sed -n '/^\[env\.commercial\]/,$p' wrangler.toml)
          echo "$block" | grep -q 'database_name = "factory-commerce"' \
            || { echo "::error::The commercial block does not name the commercial database."; exit 1; }
          if echo "$block" | grep -q 'COMMERCIAL_DATABASE_NOT_YET_PROVISIONED'; then
            echo "::error::The commercial database has not been provisioned. Bootstrap it and commit the id."
            exit 1
          fi
          if echo "$block" | grep -q '3fa6df57-8c13-4bd1-af87-756a089049b0'; then
            echo "::error::The commercial environment is bound to the FIXTURE database id."
            exit 1
          fi

      # Deployed with serving off first, always. The Worker has to exist before a
      # secret can be attached to it, so this intermediate state is unavoidable —
      # but it is not ambiguous: with no authorization row and no serving
      # variable, commercial serving is definitively closed.
      - name: Deploy with commercial serving off
        run: |
          build_id="${EDGE_BUILD_BASE}-closed"
          npx --yes wrangler@latest deploy --env "$WRANGLER_ENV" \
            --var COMMERCIAL_SERVING:disabled \
            --var MAX_DOWNLOADS_PER_GRANT:3 \
            --var EDGE_BUILD_ID:"$build_id" \
            2>&1 | tee deploy-closed.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy-closed.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::Could not determine the commercial Worker URL."
            exit 1
          fi
          echo "COMMERCIAL_BASE_URL=$url" >> "$GITHUB_ENV"

      - name: Install any missing secrets, replacing none
        run: node src/edge/deploy/ensure-edge-secrets.ts
        env:
          ALLOW_MISSING_SECRETS: 'yes'

      - name: Apply the schema and stamp the deployment identity
        run: node src/edge/deploy/migrate-edge-db.ts

      - name: Repair only the known legacy unsigned WATCH canaries
        run: node src/edge/deploy/repair-legacy-commercial-watch-canaries.ts
        env:
          I_AUTHORIZE_LEGACY_CANARY_REPAIR: 'yes'

      # Operational persistence evidence lives outside signed commercial WATCH.
      - name: Record durable state before redeploy
        run: |
          stamp="deploy-proof-${GITHUB_RUN_ID}"
          npx --yes wrangler@latest d1 execute factory-commerce --remote --yes --command \
            "INSERT INTO edge_deploy_canary (canary_id, build_id, purpose) VALUES ('$stamp', '${EDGE_BUILD_BASE}-closed', 'COMMERCIAL')"
          echo "CANARY_ID=$stamp" >> "$GITHUB_ENV"
          npx --yes wrangler@latest d1 execute factory-commerce --remote --yes --json \
            --command "SELECT count(*) AS canaries FROM edge_deploy_canary" | tee before.json

      - name: Redeploy
        run: |
          build_id="${EDGE_BUILD_BASE}-redeployed"
          npx --yes wrangler@latest deploy --env "$WRANGLER_ENV" \
            --var COMMERCIAL_SERVING:disabled \
            --var MAX_DOWNLOADS_PER_GRANT:3 \
            --var EDGE_BUILD_ID:"$build_id"
          node src/edge/deploy/migrate-edge-db.ts

      - name: Prove durable state survived the redeploy
        run: |
          after=$(npx --yes wrangler@latest d1 execute factory-commerce --remote --yes --json \
            --command "SELECT canary_id FROM edge_deploy_canary WHERE canary_id = '$CANARY_ID'")
          echo "$after"
          echo "$after" | grep -q "$CANARY_ID" \
            || { echo "::error::A redeploy lost durable deployment state."; exit 1; }
          echo "The canary written before the redeploy is still present afterwards."

      # WATCH may correctly be empty on a dormant commercial edge. An UPDATE
      # of an empty table changes zero rows and therefore cannot exercise a row
      # trigger. Verify the installed database guards themselves without
      # polluting WATCH with an operational test event.
      - name: Prove the commercial journal has both append-only guards
        run: |
          guards=$(npx --yes wrangler@latest d1 execute factory-commerce --remote --yes --json \
            --command "SELECT name, sql FROM sqlite_master WHERE type='trigger' AND name IN ('watch_event_inbox_no_update','watch_event_inbox_no_delete') ORDER BY name")
          echo "$guards"
          echo "$guards" | grep -q 'watch_event_inbox_no_update' \
            || { echo "::error::WATCH has no no-update trigger."; exit 1; }
          echo "$guards" | grep -q 'watch_event_inbox_no_delete' \
            || { echo "::error::WATCH has no no-delete trigger."; exit 1; }
          count=$(echo "$guards" | grep -o 'watch_event_inbox is append-only' | wc -l | tr -d ' ')
          if [ "$count" != "2" ]; then
            echo "::error::WATCH append-only trigger definitions are incomplete."
            exit 1
          fi

      # Only now, and only if the database itself already carries an owner
      # authorization, may serving be turned on.
      - name: Enable commercial serving
        if: ${{ inputs.serving == 'enabled' }}
        run: |
          scope="${{ inputs.scope_digest }}"
          count=$(npx --yes wrangler@latest d1 execute factory-commerce --remote --yes --json \
            --command "SELECT count(*) AS n FROM commercial_launch_grant g WHERE g.scope_digest='$scope' AND datetime(g.expires_at)>datetime('now') AND NOT EXISTS (SELECT 1 FROM commercial_launch_revocation r WHERE r.authorization_key=g.authorization_key)" | grep -oE '"n": *[0-9]+' | grep -oE '[0-9]+')
          echo "authorizations: $count"
          if [ "${count:-0}" -lt 1 ]; then
            echo "::error::Refusing to enable serving: the database holds no owner launch authorization."
            exit 1
          fi
          npx --yes wrangler@latest deploy --env "$WRANGLER_ENV" \
            --var COMMERCIAL_SERVING:enabled \
            --var COMMERCIAL_SCOPE_DIGEST:"$scope" \
            --var MAX_DOWNLOADS_PER_GRANT:3 \
            --var EDGE_BUILD_ID:"${EDGE_BUILD_BASE}-enabled"

      # curl -f throws away the body and headers on an error status, which is
      # exactly when they matter. This reads the status and the edge's own
      # failure reason instead.
      # A deploy returning is not the same as every colo serving it.
      - name: Wait for the deployed version to be the one answering
        run: |
          if [ "${{ inputs.serving }}" = "enabled" ]; then
            expected="${EDGE_BUILD_BASE}-enabled"
          else
            expected="${EDGE_BUILD_BASE}-redeployed"
          fi
          for attempt in $(seq 1 30); do
            live=$(curl -sS "$COMMERCIAL_BASE_URL/posture" | grep -o '"buildId": "[^"]*"' | cut -d'"' -f4 || true)
            if [ "$live" = "$expected" ]; then
              echo "Build $expected is live after $attempt check(s)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::The deployed build never became the one answering (saw '${live:-none}')."
          exit 1

      - name: Prove an ordinary application route survives WATCH replay
        run: |
          status=$(curl -sS -o smoke.body -w '%{http_code}' -D smoke.headers \
            "$COMMERCIAL_BASE_URL/p/__factory_missing_experiment__")
          echo "GET /p/__factory_missing_experiment__ -> $status"
          cat smoke.body
          if [ "$status" != "404" ]; then
            grep -i '^x-factory-edge-failure:' smoke.headers || true
            echo "::error::Expected the normal empty-catalog application response (404)."
            exit 1
          fi
          if grep -qi '^x-factory-edge-failure:' smoke.headers; then
            echo "::error::Normal application route carried an edge failure header."
            exit 1
          fi

      - name: Report the deployed posture
        run: |
          status=$(curl -sS -o posture.json -w '%{http_code}' -D posture.headers "$COMMERCIAL_BASE_URL/posture")
          echo "GET /posture -> $status"
          grep -i '^x-factory-edge-failure:' posture.headers || true
          posture=$(cat posture.json)
          echo "$posture"
          if [ "$status" != "200" ]; then
            echo "::error::The commercial edge could not report its posture."
            exit 1
          fi
          echo "$posture" | grep -q '"deploymentPurpose": "COMMERCIAL"' \
            || { echo "::error::The commercial edge does not identify itself as COMMERCIAL."; exit 1; }
          if [ "${{ inputs.serving }}" != "enabled" ]; then
            echo "$posture" | grep -q '"commercialServing": false' \
              || { echo "::error::Serving is on when it was deployed off."; exit 1; }
          else
            echo "$posture" | grep -q '"commercialServing": true' \
              || { echo "::error::The final enabled deployment did not reach enabled posture."; exit 1; }
            echo "$posture" | grep -q '"missingConfiguration": \[\]' \
              || { echo "::error::Enabled posture is missing required configuration."; exit 1; }
          fi
          {
            echo "### Commercial edge"
            echo ""
            echo "URL: $COMMERCIAL_BASE_URL"
            echo ""
            echo '```json'
            echo "$posture"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
