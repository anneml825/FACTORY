name: Data Economics Probe

# Milestone 0B. EXPERIMENTAL_PROTOCOL.md §7.
#
# Runs here rather than in a build session because the probe needs real outbound
# HTTPS to evidence sources, and the agent build container's egress policy denies
# general internet hosts. GitHub Actions is also Factory's intended durable
# runtime (ARCHITECTURE.md ADR-2), so this is where it belongs anyway.
#
# Cost: $0. Free sources only. No owner capital is touched and the Capital
# Authority is not involved, because nothing here can spend.

# Dispatch only, and deliberately so.
#
# This job commits its results back to the ref that triggered it. It previously
# ran on pushes to the working branch that touched src/evidence/**, package.json
# or this file, on the theory that those inputs invalidate a prior measurement.
#
# That reasoning held for a single focused commit and failed for everything else.
# GitHub evaluates path filters across the ENTIRE push range, so a branch catch-up
# push — one that fast-forwards a stale branch by many commits — matches the
# filter if any commit anywhere in that range touched a watched path. On
# 2026-08-25 a product-copy push that moved a stale branch forward by 97 commits
# fired this probe and appended a results commit to a branch in active use.
#
# A measurement must not run as a side effect of unrelated work, and must not
# rewrite the branch it was measured from. Start it by hand.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run commercial signal probe
        env:
          ENVATO_TOKEN: ${{ secrets.ENVATO_TOKEN }}
        run: npx tsx src/evidence/commercial-signals.ts

      - name: Run WordPress opportunity scan
        run: npx tsx src/evidence/wp-opportunities.ts

      - name: Run WordPress gate
        run: npx tsx src/evidence/wp-gate.ts

      - name: Run search-space reconnaissance
        run: npx tsx src/evidence/space-recon.ts

      - name: Run probe
        env:
          # Absent unless the owner registers an Etsy app. Its absence is a
          # measured finding (NO_CREDENTIAL), not a reason to skip the source.
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
        run: npx tsx src/evidence/probe.ts

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: data-economics-probe
          path: state/

      - name: Commit results
        run: |
          git config user.name "factory-probe"
          git config user.email "noreply@anthropic.com"
          git add state/
          if git diff --staged --quiet; then
            echo "No change in probe results."
            exit 0
          fi
          git commit -m "Data Economics Probe results ($(date -u +%Y-%m-%dT%H:%MZ))"
          # The branch can move while the probe runs (it takes minutes), so a bare
          # push races and is rejected as non-fast-forward. Rebase and retry.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected; rebasing onto latest and retrying."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((attempt * 5))
          done
          # The measurement is already preserved as an artifact, so a push failure
          # must not destroy the run or imply the probe itself failed.
          echo "::warning::Could not push results after 3 attempts. Results are in the uploaded artifact."
