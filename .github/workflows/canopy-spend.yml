name: Canopy spend (METERED REQUESTS)

# The only workflow in this repository that can cost money, and deliberately the
# only one: a second spending workflow would be a second copy of these guards,
# and the copy that drifts is the one that spends.
#
# It runs on a push that changes state/canopy-run-request.json, and nothing else.
# That file declares which research script to run, how many requests it intends,
# and what for. Its absence is the disarmed state; writing or editing it is the
# spend authorization, and git history attributes it. Installing this workflow
# therefore cannot run it.
#
# THE LEDGER IS THE CONTROL. Canopy can only be reached from a runner, and a
# runner is ephemeral, so a ledger that lived only inside the job would reset to
# zero every time and the budget would mean nothing. The ledger is a file in this
# repository, and a run records its INTENT before it makes a single request:
#
#   RESERVE  -> write the intended count, commit, push. If the push fails the
#               job stops here and nothing has been spent.
#   EXECUTE  -> spend, never more than was reserved.
#   SETTLE   -> rewrite with what was actually used, commit, push. Runs even
#               when the script fails.
#
# A run cancelled or crashed between RESERVE and SETTLE leaves its whole
# reservation standing against the budget. Over-counting is the intended failure
# mode: a request Factory cannot prove it avoided is assumed to have happened.
# DISARMED 2026-08-24. The push trigger has been removed, not merely pointed
# somewhere harmless. Canopy failed as the demand-research source, and the run
# request file that used to arm this workflow sits in a directory Factory edits
# routinely — leaving a trigger on it would mean an unrelated state write could
# spend metered requests. Re-arming is a deliberate act: restore the push
# trigger in a reviewable diff.
on:
  workflow_dispatch:

permissions:
  contents: write

# Never two spending runs at once, and never cancelled mid-flight — a cancelled
# run cannot settle, so it would strand its full reservation.
concurrency:
  group: canopy-spend
  cancel-in-progress: false

jobs:
  spend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANOPY_LEDGER_PATH: state/canopy-usage-ledger.json
      CANOPY_RUN_REQUEST: state/canopy-run-request.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      # The guards are only worth what their tests say they are worth, so the
      # tests run before the money does.
      - name: Budget guards pass before anything is spent
        run: |
          node --test src/research/approved-ceilings.test.ts
          node --test src/research/metered-api-budget.test.ts
          node --test src/research/spend-surface.test.ts

      # The script name is validated inside readRunRequest against a narrow
      # pattern, so an edit to a JSON file cannot become arbitrary execution
      # with a credential in scope.
      - name: Read the run request
        id: request
        run: |
          node --input-type=module -e "
            import { readRunRequest } from './src/research/canopy-run-request.ts';
            const r = await readRunRequest(process.env.CANOPY_RUN_REQUEST);
            console.log('script=' + r.script);
            console.log('intended=' + r.intendedRequests);
            console.log('note=' + r.note);
          " | tee -a "$GITHUB_OUTPUT"

      - name: RESERVE — record the intent
        run: node src/research/canopy-reserve.ts

      # If this push fails, the job fails here and no request has been made.
      - name: Make the reservation durable before spending
        run: |
          git config user.name "factory-ci"
          git config user.email "factory-ci@users.noreply.github.com"
          git add "$CANOPY_LEDGER_PATH"
          git commit -m "RESERVE ${{ steps.request.outputs.intended }} Canopy requests for run ${GITHUB_RUN_ID} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: EXECUTE — the research script
        env:
          CANOPY_API_KEY: ${{ secrets.CANOPY_API_KEY || secrets.CANOPY_KEY || secrets.CANOPYAPI_KEY }}
        run: node "${{ steps.request.outputs.script }}"

      # Always. A failed run that does not settle would leave the ledger
      # claiming the full reservation forever.
      - name: SETTLE — record what was actually spent
        if: always()
        run: |
          git config user.name "factory-ci"
          git config user.email "factory-ci@users.noreply.github.com"
          git add "$CANOPY_LEDGER_PATH" state/*.json || true
          git commit -m "SETTLE Canopy run ${GITHUB_RUN_ID} [skip ci]" || echo "nothing to settle"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Show the ledger
        if: always()
        run: cat "$CANOPY_LEDGER_PATH"
