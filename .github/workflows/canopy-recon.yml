name: Canopy reconnaissance

# Zero-cost reconnaissance from a runner, because this repository's own network
# cannot reach these hosts. NO API KEY IS SENT IN ANY STEP.
#
# Rounds 1-3 established Canopy's terms, pricing and schema. Round 4 changes
# subject: Canopy has FAILED as a KDP demand-research source — totalResults is
# unpopulated on both its category and search endpoints — so this round prices
# the alternatives that could measure demand AND competition, from their own
# published pages rather than from memory.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/factory-phase-e-remediation
    paths:
      - '.github/workflows/canopy-recon.yml'

permissions:
  contents: read

concurrency:
  group: canopy-recon
  cancel-in-progress: false

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      # Reads only Canopy's own public endpoints. No API key is present in any
      # step's environment, so none can leak and none can authenticate a
      # billable call even by accident.
      - name: Price the alternative data sources from their own pages
        run: |
          mkdir -p recon
          python3 - <<'PY2'
          import html, pathlib, re, urllib.request, urllib.error

          TARGETS = {
              "rf-pricing": "https://www.rainforestapi.com/pricing",
              "rf-home": "https://www.rainforestapi.com/",
              "rf-signup": "https://app.rainforestapi.com/sign-up",
              "rf-docs-overview": "https://docs.trajectdata.com/rainforestapi/overview",
              "rf-docs-credits": "https://docs.trajectdata.com/rainforestapi/account-api/overview",
              "traject-pricing": "https://trajectdata.com/pricing/",
          }

          def get(url):
              request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (compatible; factory-recon/1)"})
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      return response.status, response.read().decode("utf8", "replace")
              except urllib.error.HTTPError as error:
                  return error.code, ""
              except Exception as error:
                  return 0, f"{type(error).__name__}: {error}"

          def text_of(raw):
              raw = re.sub(r"(?is)<(script|style|noscript)[^>]*>.*?</\1>", " ", raw)
              return re.sub(r"\s+", " ", html.unescape(re.sub(r"(?s)<[^>]+>", " ", raw))).strip()

          MONEY = re.compile(r"(?:[$€£]\s?\d[\d,.]*|\d+\s?(?:USD|EUR|GBP))(?:\s*(?:/|per\s)\s*(?:mo|month|year|request|call|token|credit)s?)?", re.I)
          KEYS = re.compile(r"free trial|try for free|no credit card|trial|hobbyist|credits?/month|credits included|cancel|month.to.month|billed monthly", re.I)

          for name, url in TARGETS.items():
              status, raw = get(url)
              print(f"\n=============== {name}  [{status}]  {url}")
              if status != 200 or not raw:
                  print("   (not retrieved)")
                  continue
              body = text_of(raw)
              pathlib.Path(f"recon/{name}.txt").write_text(body)
              prices = []
              for m in MONEY.finditer(body):
                  window = body[max(0, m.start() - 90): m.end() + 90]
                  prices.append(re.sub(r"\s+", " ", window))
                  if len(prices) >= 8:
                      break
              print("   --- money mentions:")
              for p in prices:
                  print("      …" + p[:220])
              print("   --- capability mentions:")
              seen = 0
              for m in KEYS.finditer(body):
                  print("      …" + re.sub(r"\s+", " ", body[max(0, m.start() - 80): m.end() + 120])[:200])
                  seen += 1
                  if seen >= 10:
                      break
          PY2

      - name: Upload the raw pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canopy-recon
          path: recon/
          retention-days: 7
          if-no-files-found: warn
