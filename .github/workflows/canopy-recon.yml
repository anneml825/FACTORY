name: Canopy reconnaissance

# Reads Canopy's public documentation, published example collections, and
# open-source client code from a runner, because this repository's own network
# cannot reach them.
#
# THIS RUN SPENDS NO API CREDITS. It sends no API key and calls no billable
# endpoint. Round 1 answered the terms question and confirmed the key exists.
# Round 2 established there is no public OpenAPI document, that unauthenticated
# GraphQL introspection is refused at the edge (403), and that Canopy publishes
# an MCP server whose 11 tools name the available operations.
#
# Round 3 answers the remaining gate — what a BOOK query actually returns — by
# reading Canopy's own open-source client code, which must contain the real
# field names because it compiles against the real schema. Guessing them
# instead would spend metered requests discovering the guess was wrong, and the
# free allowance is 100 requests per month.
#
# Runs on a push that changes THIS FILE, and on manual dispatch. The push
# trigger is deliberate and self-limiting: the job spends no credits, sends no
# credential, and mutates nothing. The later probe — which does spend metered
# requests — stays manual-dispatch only.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/factory-phase-e-remediation
    paths:
      - '.github/workflows/canopy-recon.yml'

permissions:
  contents: read

concurrency:
  group: canopy-recon
  cancel-in-progress: false

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      # Reads only Canopy's own public endpoints. No API key is present in any
      # step's environment, so none can leak and none can authenticate a
      # billable call even by accident.
      - name: Read Canopy's published example collection and REST root
        run: |
          mkdir -p recon
          echo "=== rest.canopyapi.co root ==="
          curl -sS --max-time 20 https://rest.canopyapi.co/ -o recon/rest-root.txt || true
          head -c 3500 recon/rest-root.txt
          echo
          echo "=== docs hoppscotch collection (real example requests) ==="
          curl -sS --max-time 20 https://docs.canopyapi.co/hoppscotch-collection.json \
            -o recon/hoppscotch.json || true
          python3 -c "import json,sys;print(json.dumps(json.load(open('recon/hoppscotch.json')),indent=1)[:6000])" || cat recon/hoppscotch.json

      # Canopy's own MCP server and examples are public source. They compile
      # against the real schema, so their queries are the schema — no guessing,
      # no metered request spent to find out.
      - name: Clone Canopy's open-source clients
        run: |
          mkdir -p src-canopy
          for repo in canopy-api-mcp canopy-api; do
            echo "--- cloning $repo"
            git clone --depth 1 --quiet "https://github.com/canopy-api/$repo.git" "src-canopy/$repo" \
              && echo "    ok" || echo "    FAILED"
          done
          echo
          echo "=== files ==="
          find src-canopy -type f \
            \( -name '*.ts' -o -name '*.js' -o -name '*.graphql' -o -name '*.gql' -o -name '*.json' -o -name '*.md' \) \
            -not -path '*/node_modules/*' -not -name 'package-lock.json' \
            | head -120

      - name: The GraphQL operations, verbatim
        run: |
          python3 - <<'PY2'
          import pathlib, re
          roots = list(pathlib.Path("src-canopy").rglob("*"))
          files = [
              p for p in roots
              if p.is_file()
              and p.suffix in {".ts", ".js", ".mjs", ".graphql", ".gql", ".tsx"}
              and "node_modules" not in p.parts
          ]
          print(f"scanning {len(files)} source files")
          printed = 0
          for path in sorted(files):
              text = path.read_text("utf8", errors="replace")
              # Template literals and .graphql bodies containing a GraphQL operation.
              blocks = re.findall(r"`([^`]*?(?:query|mutation)\s[^`]*?)`", text, re.S)
              if path.suffix in {".graphql", ".gql"}:
                  blocks.append(text)
              for block in blocks:
                  if "{" not in block or len(block) < 40:
                      continue
                  print(f"\n----- {path} -----")
                  print(block.strip()[:2500])
                  printed += 1
                  if printed >= 25:
                      raise SystemExit(0)
          if printed == 0:
              print("(no GraphQL operation literals found)")
          PY2

      - name: Tool definitions, input schemas and book vocabulary
        run: |
          echo "=== TOOL / OPERATION NAMES ==="
          grep -rhoE '(get|search|list)_amazon_[a-z_]+' src-canopy --include='*.ts' --include='*.js' --include='*.md' \
            | sort -u || true
          echo
          echo "=== BOOK-SPECIFIC VOCABULARY ==="
          grep -rniE 'isbn|publicationDate|publication_date|numberOfPages|pageCount|print.?length|bookDetails|salesRank|bestSeller|best_seller|rankings?|monthlySales|salesEstimate|categoryId|browse' \
            src-canopy --include='*.ts' --include='*.js' --include='*.graphql' --include='*.md' \
            | grep -v node_modules | head -80 || echo "(none)"
          echo
          echo "=== SEARCH / CATEGORY INPUT SHAPES ==="
          grep -rn -A 18 -iE 'search_amazon_products|amazonProductSearchResults|get_amazon_category\b' \
            src-canopy --include='*.ts' --include='*.js' \
            | grep -v node_modules | head -140 || echo "(none)"

      - name: Upload the raw pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canopy-recon
          path: recon/
          retention-days: 7
          if-no-files-found: warn
