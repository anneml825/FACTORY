# Cloudflare Worker configuration for Factory's edges.
#
# There are two, and they must never be confused. The top-level configuration is
# the FIXTURE edge: disposable, reset on every proof, and the only one any
# destructive script will touch. `[env.commercial]` is the COMMERCIAL edge:
# a different Worker, a different database, never reset, and refused by every
# script that drops anything.
#
# Names are duplicated from src/edge/deploy/edge-targets.ts, which is the single
# source of truth every script resolves through; the isolation test asserts the
# two do not drift apart.
#
# A D1 database_id is an identifier, not a credential: it grants nothing without
# an API token, and Cloudflare's own docs put it in this file. The token and
# account ID stay in GitHub secrets.
#
# The download-counter binding must be D1 or a Durable Object before any real
# checkout — KV cannot enforce a limit atomically.

name = "factory-edge"
main = "src/edge/worker.ts"
compatibility_date = "2026-08-18"
compatibility_flags = ["nodejs_compat"]

# Verified against official docs on 2026-08-19 (docs/PHASE_E_CLOUDFLARE_VERIFICATION.md):
# Workers Free gives 100,000 requests/day and 50 subrequests per invocation; D1 Free
# gives 5M rows read/day, 100k rows written/day, 10 databases, 500 MB per database.
#
# KV is NOT used: it cannot enforce a download limit atomically. D1 is the state store.
# R2 is deferred — it is a usage-based billing service subject to card preauthorization,
# and the fixture artifact is ~1 KB, so D1 holds it for the fixture proof only.
[[d1_databases]]
binding = "EDGE_DB"
database_name = "factory-edge"
database_id = "3fa6df57-8c13-4bd1-af87-756a089049b0"

# Secrets are set with `wrangler secret put`, never committed:
#   STRIPE_WEBHOOK_SECRET, EDGE_DELIVERY_SECRET,
#   EDGE_INTERNAL_TRAFFIC_TOKEN, WATCH_EVENT_SECRET
#
# On the fixture edge they are regenerated per proof, which is why the fixture
# database is reset alongside them. On the commercial edge they are installed
# once and never replaced: WATCH_EVENT_SECRET and EDGE_DELIVERY_SECRET sign
# durable history, so replacing either would invalidate records that are
# supposed to be permanent.

# --------------------------------------------------------------------------
# The COMMERCIAL edge. Bindings are NOT inherited from the top level, so they
# are repeated here in full and deliberately point somewhere else.
#
# Created by commercial-deploy run 32303047677 on 2026-08-19. Before it existed
# this id was an invalid placeholder, and Cloudflare rejected the deploy with
# "binding EDGE_DB of type d1 must have a valid database_id" rather than falling
# back to anything — which is the failure mode this configuration wants.
# --------------------------------------------------------------------------
[env.commercial]
name = "factory-commerce"

[[env.commercial.d1_databases]]
binding = "EDGE_DB"
database_name = "factory-commerce"
database_id = "9bb782b4-276b-4e81-a2be-a9e992ab94de"
